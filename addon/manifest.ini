name = dectalkExpress
summary = "DECtalk Express driver for NVDA"
description = """Adds support for using a DECtalk Express hardware speech synthesizer (or another DECtalk unit in RS-232 mode) to NVDA. Supports all voices, rate, pitch, inflection, pauses, custom voices, firmware and battery status, and firmware upgrades."""
